name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The TestBench UI (src/SimpleSign.TestBench/web) is built by the testbench job, not by every build.
  SkipWeb: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET (multi-target)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Check for vulnerable packages
        continue-on-error: true
        run: dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerability-report.txt

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vulnerability-report-${{ matrix.os }}
          path: vulnerability-report.txt

      - name: Test
        if: matrix.os != 'ubuntu-latest'
        shell: bash
        run: |
          dotnet test --no-build --configuration Release \
            --filter "Category!=Stress" \
            --logger "trx" \
            --logger "console;verbosity=normal" \
            --results-directory TestResults

      - name: Test (with coverage)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          dotnet test --no-build --configuration Release \
            --filter "Category!=Stress" \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.runsettings \
            --results-directory TestResults \
            --logger "trx" \
            --logger "console;verbosity=normal"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: TestResults/*/coverage.cobertura.xml
          fail_ci_if_error: false

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: build-and-test
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download coverage artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-results-ubuntu-latest
          path: coverage-raw

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate report
        run: |
          reportgenerator \
            -reports:"coverage-raw/**/coverage.cobertura.xml" \
            -targetdir:coverage-report \
            -reporttypes:"Html;MarkdownSummary;TextSummary" \
            -assemblyfilters:"+SimpleSign.*;-SimpleSign.*.Tests;-SimpleSign.TestHelpers"

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage-report/

      - name: Coverage summary
        run: cat coverage-report/Summary.md >> $GITHUB_STEP_SUMMARY

  pack:
    name: Pack NuGet
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Pack all libraries
        run: |
          for proj in src/SimpleSign/SimpleSign.csproj \
                     src/SimpleSign.Core/SimpleSign.Core.csproj \
                     src/SimpleSign.Pdf/SimpleSign.Pdf.csproj \
                     src/SimpleSign.PAdES/SimpleSign.PAdES.csproj \
                     src/SimpleSign.Brasil/SimpleSign.Brasil.csproj \
                     src/SimpleSign.HtmlToPdf/SimpleSign.HtmlToPdf.csproj \
                     src/SimpleSign.Cli/SimpleSign.Cli.csproj \
                     src/SimpleSign.CAdES/SimpleSign.CAdES.csproj \
                     src/SimpleSign.XAdES/SimpleSign.XAdES.csproj \
                     src/SimpleSign.Signers.Pkcs11/SimpleSign.Signers.Pkcs11.csproj \
                     src/SimpleSign.Signers.Cloud/SimpleSign.Signers.Cloud.csproj; do
            dotnet pack "$proj" --configuration Release --no-restore --output ./nupkg
          done

      - name: Upload NuGet packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkg
          path: ./nupkg/*.nupkg

  mutation-test:
    name: Mutation Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release

      - name: Run mutation tests
        continue-on-error: true
        run: dotnet stryker

      - name: Upload Stryker report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stryker-report
          path: StrykerOutput/

  stress-test:
    name: Stress Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release

      - name: Run stress tests
        continue-on-error: true
        timeout-minutes: 15
        run: |
          dotnet test --no-build --configuration Release \
            --filter "Category=Stress" \
            --logger "console;verbosity=normal" \
            --results-directory TestResults-Stress

      - name: Upload stress test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stress-test-results
          path: TestResults-Stress/

  aot-smoke-test:
    name: AOT Smoke Test
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Publish AOT
        run: dotnet publish tests/smoke/SimpleSign.AotSmokeTest -c Release -f net10.0 -r linux-x64

      - name: Run AOT smoke test
        run: ./tests/smoke/SimpleSign.AotSmokeTest/bin/Release/net10.0/linux-x64/publish/SimpleSign.AotSmokeTest

  pkcs11-tests:
    name: PKCS#11 (SoftHSM2)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET (multi-target)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install SoftHSM2 and OpenSC
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends softhsm2 opensc

      - name: Run PKCS#11 tests and AOT smoke test
        run: scripts/tests/pkcs11-run.sh

  testbench:
    name: TestBench
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build the UI (type-check + bundle)
        working-directory: src/SimpleSign.TestBench/web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Test the TestBench (compatibility rules, every credential kind, full run matrix)
        run: dotnet test tests/unit/SimpleSign.TestBench.Tests --configuration Release --logger "console;verbosity=normal"

  agent:
    name: Agent (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Test signing agent
        run: dotnet test tests/unit/SimpleSign.Agent.Tests --configuration Release --logger "console;verbosity=normal"

      - name: Build agent app
        run: dotnet build src/SimpleSign.Agent --configuration Release

