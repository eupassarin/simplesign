name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The TestBench (a local dev tool) is not released; skip building its UI.
  SkipWeb: true

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: Pack & Publish NuGet
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test --no-build --configuration Release --filter "Category!=Stress" --verbosity quiet

      - name: Test NativeAOT smoke application
        run: |
          dotnet publish tests/smoke/SimpleSign.AotSmokeTest/SimpleSign.AotSmokeTest.csproj \
            --configuration Release \
            --framework net8.0 \
            --runtime linux-x64 \
            --output publish-aot-smoke
          ./publish-aot-smoke/SimpleSign.AotSmokeTest

      - name: Pack
        shell: bash
        run: |
          projects=(
            src/Core/SimpleSign.Core/SimpleSign.Core.csproj
            src/Formats/SimpleSign.PAdES/SimpleSign.PAdES.csproj
            src/Formats/SimpleSign.CAdES/SimpleSign.CAdES.csproj
            src/Formats/SimpleSign.XAdES/SimpleSign.XAdES.csproj
            src/TrustFrameworks/Brazil/SimpleSign.Brazil/SimpleSign.Brazil.csproj
            src/TrustFrameworks/Brazil/IcpBrasil/SimpleSign.Brazil.IcpBrasil/SimpleSign.Brazil.IcpBrasil.csproj
            src/TrustFrameworks/Brazil/IcpBrasil/SimpleSign.Brazil.IcpBrasil.Xades/SimpleSign.Brazil.IcpBrasil.Xades.csproj
            src/TrustFrameworks/Brazil/IcpBrasil/SimpleSign.Brazil.Fiscal/SimpleSign.Brazil.Fiscal.csproj
            src/TrustFrameworks/Brazil/GovBr/SimpleSign.Brazil.GovBr/SimpleSign.Brazil.GovBr.csproj
            src/Signers/SimpleSign.Signers.Pkcs11/SimpleSign.Signers.Pkcs11.csproj
            src/Signers/SimpleSign.Signers.Cloud/SimpleSign.Signers.Cloud.csproj
            src/Extras/SimpleSign.HtmlToPdf/SimpleSign.HtmlToPdf.csproj
            src/Formats/SimpleSign/SimpleSign.csproj
            src/Apps/SimpleSign.Cli/SimpleSign.Cli.csproj
          )

          for project in "${projects[@]}"; do
            dotnet pack "$project" \
              --no-build \
              --configuration Release \
              -p:Version=${{ steps.version.outputs.version }} \
              --output nupkgs
          done

      - name: NuGet login (OIDC → temporary API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          # nuget.org username (profile name), not the email address.
          user: ${{ secrets.NUGET_USER || 'eupassarin' }}

      - name: Push to NuGet.org
        run: |
          set -euo pipefail
          dotnet nuget push "nupkgs/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate
          dotnet nuget push "nupkgs/*.snupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

      - name: Upload packages artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkgs-${{ steps.version.outputs.version }}
          path: nupkgs/

  agent:
    name: Publish Agent (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    needs: release
    strategy:
      matrix:
        include:
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: windows-latest, rid: win-x64 }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test signing agent
        run: dotnet test tests/unit/Apps/SimpleSign.Agent.Tests --configuration Release --verbosity quiet

      - name: Package (macOS / Linux)
        if: runner.os != 'Windows'
        run: scripts/package-agent.sh ${{ matrix.rid }} ${{ steps.version.outputs.version }} artifacts/agent

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet publish src/Apps/SimpleSign.Agent/SimpleSign.Agent.csproj -c Release -r win-x64 --self-contained true `
            -p:Version=${{ steps.version.outputs.version }} -o publish-agent
          New-Item -ItemType Directory -Force artifacts/agent | Out-Null
          Compress-Archive -Path publish-agent\* -DestinationPath artifacts/agent/SimpleSignAgent-${{ steps.version.outputs.version }}-win-x64.zip

      - name: Upload Agent to Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/agent/*
