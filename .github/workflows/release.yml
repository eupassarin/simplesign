name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: Pack & Publish NuGet
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test --no-build --configuration Release --filter "Category!=Stress" --verbosity quiet

      - name: Test NativeAOT smoke application
        run: |
          dotnet publish tests/smoke/SimpleSign.AotSmokeTest/SimpleSign.AotSmokeTest.csproj \
            --configuration Release \
            --framework net8.0 \
            --runtime linux-x64 \
            --output publish-aot-smoke
          ./publish-aot-smoke/SimpleSign.AotSmokeTest

      - name: Pack
        shell: bash
        run: |
          projects=(
            src/SimpleSign.Core/SimpleSign.Core.csproj
            src/SimpleSign.Pdf/SimpleSign.Pdf.csproj
            src/SimpleSign.PAdES/SimpleSign.PAdES.csproj
            src/SimpleSign.CAdES/SimpleSign.CAdES.csproj
            src/SimpleSign.XAdES/SimpleSign.XAdES.csproj
            src/SimpleSign.Brasil/SimpleSign.Brasil.csproj
            src/SimpleSign.HtmlToPdf/SimpleSign.HtmlToPdf.csproj
            src/SimpleSign/SimpleSign.csproj
            src/SimpleSign.Cli/SimpleSign.Cli.csproj
          )

          for project in "${projects[@]}"; do
            dotnet pack "$project" \
              --no-build \
              --configuration Release \
              -p:Version=${{ steps.version.outputs.version }} \
              --output nupkgs
          done

      - name: NuGet login (OIDC → temporary API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          # nuget.org username (profile name), not the email address.
          user: ${{ secrets.NUGET_USER || 'eupassarin' }}

      - name: Push to NuGet.org
        run: |
          set -euo pipefail
          dotnet nuget push "nupkgs/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

      - name: Upload packages artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkgs-${{ steps.version.outputs.version }}
          path: nupkgs/

  cli:
    name: Publish CLI (multi-platform)
    runs-on: ubuntu-latest
    needs: release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test CLI
        run: >-
          dotnet test tests/cli/SimpleSign.Cli.Tests/SimpleSign.Cli.Tests.csproj
          --configuration Release
          --framework net8.0
          --filter "Category!=Stress"
          --verbosity quiet

      - name: Publish CLI (framework-dependent)
        shell: bash
        run: |
          for runtime in linux-x64 win-x64 osx-x64 osx-arm64; do
            dotnet publish src/SimpleSign.Cli/SimpleSign.Cli.csproj \
              --configuration Release \
              --framework net8.0 \
              --runtime "$runtime" \
              --self-contained false \
              -p:Version=${{ steps.version.outputs.version }} \
              --output "publish-cli/$runtime"
          done

      - name: Package (linux-x64)
        run: (cd publish-cli/linux-x64 && zip -r ../../simplesign-linux-x64.zip .)

      - name: Package (win-x64)
        run: (cd publish-cli/win-x64 && zip -r ../../simplesign-win-x64.zip .)

      - name: Package (osx-x64)
        run: (cd publish-cli/osx-x64 && zip -r ../../simplesign-osx-x64.zip .)

      - name: Package (osx-arm64)
        run: (cd publish-cli/osx-arm64 && zip -r ../../simplesign-osx-arm64.zip .)

      - name: Upload CLI to Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            simplesign-linux-x64.zip
            simplesign-win-x64.zip
            simplesign-osx-x64.zip
            simplesign-osx-arm64.zip


  hostsigner:
    name: Publish HostSigner
    runs-on: windows-latest
    needs: release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test HostSigner
        run: >-
          dotnet test tests/unit/SimpleSign.HostSigner.Tests/SimpleSign.HostSigner.Tests.csproj
          --configuration Release
          --framework net8.0-windows
          --filter "Category!=Stress"
          --verbosity quiet

      - name: Publish HostSigner (win-x64)
        run: |
          dotnet publish src/SimpleSign.HostSigner/SimpleSign.HostSigner.csproj `
            -c Release `
            -f net8.0-windows `
            -r win-x64 `
            --self-contained true `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish-hostsigner

      - name: Create HostSigner ZIP
        run: Compress-Archive -Path publish-hostsigner\* -DestinationPath simplesign-hostsigner-win-x64.zip

      - name: Upload HostSigner to Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          files: simplesign-hostsigner-win-x64.zip
