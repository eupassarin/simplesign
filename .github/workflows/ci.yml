name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The TestBench UI (src/Apps/SimpleSign.TestBench/web) is built by the testbench job, not by every build.
  SkipWeb: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET (multi-target)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Check for vulnerable packages
        continue-on-error: true
        run: dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerability-report.txt

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vulnerability-report-${{ matrix.os }}
          path: vulnerability-report.txt

      # The TestBench tests sign and validate against a running SimpleSign Sandbox (test PKI, CRLs over
      # HTTP/HTTPS/LDAP, OCSP, TSAs, CSC). A throwaway environment, deleted when the job ends.
      - name: Start the SimpleSign Sandbox
        shell: bash
        run: |
          dotnet run --project src/Apps/SimpleSign.Sandbox --no-build --configuration Release -- --ephemeral --no-browser > sandbox.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5300/api/info > /dev/null 2>&1; then
              echo "Sandbox is up"; exit 0
            fi
            sleep 2
          done
          echo "The Sandbox did not answer on http://localhost:5300"; cat sandbox.log; exit 1

      - name: Test
        if: matrix.os != 'ubuntu-latest'
        shell: bash
        env:
          SIMPLESIGN_SANDBOX_URL: http://localhost:5300/
          SIMPLESIGN_REQUIRE_SANDBOX: "true"
        run: |
          dotnet test --no-build --configuration Release \
            --filter "Category!=Stress" \
            --logger "trx" \
            --logger "console;verbosity=normal" \
            --results-directory TestResults

      - name: Test (with coverage)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          SIMPLESIGN_SANDBOX_URL: http://localhost:5300/
          SIMPLESIGN_REQUIRE_SANDBOX: "true"
        run: |
          dotnet test --no-build --configuration Release \
            --filter "Category!=Stress" \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.runsettings \
            --results-directory TestResults \
            --logger "trx" \
            --logger "console;verbosity=normal"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: |
            TestResults/
            sandbox.log

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: TestResults/*/coverage.cobertura.xml
          fail_ci_if_error: false

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: build-and-test
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download coverage artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-results-ubuntu-latest
          path: coverage-raw

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate report
        run: |
          reportgenerator \
            -reports:"coverage-raw/**/coverage.cobertura.xml" \
            -targetdir:coverage-report \
            -reporttypes:"Html;MarkdownSummary;TextSummary" \
            -assemblyfilters:"+SimpleSign.*;-SimpleSign.*.Tests;-SimpleSign.TestHelpers"

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage-report/

      - name: Coverage summary
        run: cat coverage-report/Summary.md >> $GITHUB_STEP_SUMMARY

  pack:
    name: Pack NuGet
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Pack all libraries
        run: |
          for proj in src/Formats/SimpleSign/SimpleSign.csproj \
                     src/Core/SimpleSign.Core/SimpleSign.Core.csproj \
                     src/Formats/SimpleSign.PAdES/SimpleSign.PAdES.csproj \
                     src/TrustFrameworks/Brazil/SimpleSign.Brazil/SimpleSign.Brazil.csproj \
                     src/TrustFrameworks/Brazil/IcpBrasil/SimpleSign.Brazil.IcpBrasil/SimpleSign.Brazil.IcpBrasil.csproj \
                     src/TrustFrameworks/Brazil/IcpBrasil/SimpleSign.Brazil.IcpBrasil.Xades/SimpleSign.Brazil.IcpBrasil.Xades.csproj \
                     src/TrustFrameworks/Brazil/IcpBrasil/SimpleSign.Brazil.Fiscal/SimpleSign.Brazil.Fiscal.csproj \
                     src/TrustFrameworks/Brazil/GovBr/SimpleSign.Brazil.GovBr/SimpleSign.Brazil.GovBr.csproj \
                     src/TrustFrameworks/Peru/Iofe/SimpleSign.Peru.Iofe/SimpleSign.Peru.Iofe.csproj \
                     src/Extras/SimpleSign.HtmlToPdf/SimpleSign.HtmlToPdf.csproj \
                     src/Apps/SimpleSign.Cli/SimpleSign.Cli.csproj \
                     src/Formats/SimpleSign.CAdES/SimpleSign.CAdES.csproj \
                     src/Formats/SimpleSign.XAdES/SimpleSign.XAdES.csproj \
                     src/Signers/SimpleSign.Signers.Pkcs11/SimpleSign.Signers.Pkcs11.csproj \
                     src/Signers/SimpleSign.Signers.Cloud/SimpleSign.Signers.Cloud.csproj; do
            dotnet pack "$proj" --configuration Release --no-restore --output ./nupkg
          done

      - name: Upload NuGet packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkg
          path: ./nupkg/*.nupkg

  stress-test:
    name: Stress Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release

      - name: Run stress tests
        continue-on-error: true
        timeout-minutes: 15
        run: |
          dotnet test --no-build --configuration Release \
            --filter "Category=Stress" \
            --logger "console;verbosity=normal" \
            --results-directory TestResults-Stress

      - name: Upload stress test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stress-test-results
          path: TestResults-Stress/

  aot-smoke-test:
    name: AOT Smoke Test
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Publish AOT
        run: dotnet publish tests/smoke/SimpleSign.AotSmokeTest -c Release -f net10.0 -r linux-x64

      - name: Run AOT smoke test
        run: ./tests/smoke/SimpleSign.AotSmokeTest/bin/Release/net10.0/linux-x64/publish/SimpleSign.AotSmokeTest

  pkcs11-tests:
    name: PKCS#11 (SoftHSM2)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET (multi-target)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install SoftHSM2 and OpenSC
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends softhsm2 opensc

      - name: Run PKCS#11 tests and AOT smoke test
        run: scripts/tests/pkcs11-run.sh

  # The PowerShell versions of the stack scripts (tools/stack/*.ps1, scripts/tests/pkcs11.ps1) on Windows. GitHub's
  # Windows runners cannot run Linux containers, so up.ps1 / down.ps1 / pkcs11.ps1 are only linted here; the token
  # step (softhsm-provision.ps1) runs for real, against a Sandbox started with dotnet run.
  windows-scripts:
    name: Windows scripts (PowerShell)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Lint (PSScriptAnalyzer)
        run: |
          "PowerShell $($PSVersionTable.PSVersion) on $([Environment]::OSVersion.VersionString)"
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $scripts = Get-ChildItem tools/stack/*.ps1, scripts/tests/*.ps1
          # Write-Host is what these scripts are for: messages to whoever runs them.
          $findings = $scripts | ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Severity Warning, Error -ExcludeRule PSAvoidUsingWriteHost }
          $findings | Format-Table ScriptName, Line, RuleName, Message -AutoSize -Wrap
          if ($findings) { throw "$(@($findings).Count) PSScriptAnalyzer finding(s)." }
          # The runner's 'stop' would turn the child's stderr (the expected "Unknown option") into a silent failure.
          $ErrorActionPreference = 'Continue'
          foreach ($script in $scripts) {
            & pwsh -NoProfile -File $script.FullName -Help | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "$($script.Name) -Help exited with $LASTEXITCODE." }
            # testbench.ps1 hands every other argument to the TestBench.
            if ($script.Name -eq 'testbench.ps1') { "$($script.Name): -Help ok"; continue }
            $message = (& pwsh -NoProfile -File $script.FullName -NoSuchOption 2>&1 | Out-String).Trim()
            if ($LASTEXITCODE -ne 2) { throw "$($script.Name) -NoSuchOption exited with $LASTEXITCODE, not 2: $message" }
            "$($script.Name): -Help ok, -NoSuchOption exits 2 ($message)"
          }
          # The last check leaves $LASTEXITCODE at 2, which the runner would report as the step's exit code.
          exit 0

      - name: Install SoftHSM2 for Windows and OpenSC
        run: |
          # Pinned downloads: SoftHSM2 for Windows 2.5.0 (portable, into C:\SoftHSM2) and OpenSC 0.27.1.
          $softhsm = "$env:RUNNER_TEMP\softhsm2.zip"
          Invoke-WebRequest https://github.com/disig/SoftHSM2-for-Windows/releases/download/v2.5.0/SoftHSM2-2.5.0-portable.zip -OutFile $softhsm
          if ((Get-FileHash $softhsm -Algorithm SHA256).Hash -ne '85273BCC1A6B90E877F7BB4F7E90221D57103D8F5241D154A79DD730A135B910') { throw 'SoftHSM2 download: unexpected SHA-256.' }
          Expand-Archive $softhsm -DestinationPath C:\
          $opensc = "$env:RUNNER_TEMP\opensc.msi"
          Invoke-WebRequest https://github.com/OpenSC/OpenSC/releases/download/0.27.1/OpenSC-0.27.1_x64.msi -OutFile $opensc
          if ((Get-FileHash $opensc -Algorithm SHA256).Hash -ne '88EA45E848063FF5F3594A457B7F023223472EAE9C9C543F8035F7689BB7B319') { throw 'OpenSC download: unexpected SHA-256.' }
          $install = Start-Process msiexec.exe -ArgumentList '/i', $opensc, '/qn', '/norestart' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "OpenSC install exited with $($install.ExitCode)." }

      - name: Start the SimpleSign Sandbox
        run: |
          Start-Process dotnet -ArgumentList 'run', '--project', 'src/Apps/SimpleSign.Sandbox', '--configuration', 'Release', '--', '--ephemeral', '--no-browser' `
            -RedirectStandardOutput sandbox.log -RedirectStandardError sandbox.err.log
          foreach ($i in 1..120) {
            try { Invoke-RestMethod http://localhost:5300/api/info -TimeoutSec 5 | Out-Null; 'Sandbox is up'; exit 0 } catch { Start-Sleep 3 }
          }
          Get-Content sandbox.log, sandbox.err.log; throw 'The Sandbox did not answer on http://localhost:5300'

      - name: Fill the SoftHSM token (softhsm-provision.ps1)
        run: |
          pwsh -NoProfile -File tools/stack/softhsm-provision.ps1
          if ($LASTEXITCODE -ne 0) { throw "softhsm-provision.ps1 exited with $LASTEXITCODE." }
          $env:SOFTHSM2_CONF = "$PWD\.softhsm\softhsm2.conf"
          $objects = & "$env:ProgramFiles\OpenSC Project\OpenSC\tools\pkcs11-tool.exe" --module C:\SoftHSM2\lib\softhsm2-x64.dll `
            --token-label 'SimpleSign Sandbox' --login --pin 1234 --list-objects
          $keys = @($objects | Select-String 'Private Key Object').Count
          $certificates = @($objects | Select-String 'Certificate Object').Count
          "$keys private key(s), $certificates certificate(s)"
          if ($keys -lt 1 -or $keys -ne $certificates) { throw 'The token does not hold one key per certificate.' }
          # A second run finds the token up to date.
          $again = pwsh -NoProfile -File tools/stack/softhsm-provision.ps1
          if (-not ($again -match 'nothing to do')) { throw "The second run rebuilt the token: $again" }

  testbench:
    name: TestBench
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build the UI (type-check + bundle)
        working-directory: src/Apps/SimpleSign.TestBench/web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build
        run: dotnet build tests/unit/Apps/SimpleSign.TestBench.Tests --configuration Release && dotnet build src/Apps/SimpleSign.Sandbox --configuration Release -p:SkipWeb=true

      # The TestBench tests sign and validate against a running SimpleSign Sandbox.
      - name: Start the SimpleSign Sandbox
        shell: bash
        run: |
          dotnet run --project src/Apps/SimpleSign.Sandbox --no-build --configuration Release -- --ephemeral --no-browser > sandbox.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5300/api/info > /dev/null 2>&1; then
              echo "Sandbox is up"; exit 0
            fi
            sleep 2
          done
          echo "The Sandbox did not answer on http://localhost:5300"; cat sandbox.log; exit 1

      - name: Test the TestBench (compatibility rules, every credential kind, full run matrix)
        env:
          SIMPLESIGN_SANDBOX_URL: http://localhost:5300/
          SIMPLESIGN_REQUIRE_SANDBOX: "true"
        run: dotnet test tests/unit/Apps/SimpleSign.TestBench.Tests --configuration Release --no-build --logger "console;verbosity=normal"

  agent:
    name: Agent (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Test signing agent
        run: dotnet test tests/unit/Apps/SimpleSign.Agent.Tests --configuration Release --logger "console;verbosity=normal"

      - name: Build agent app
        run: dotnet build src/Apps/SimpleSign.Agent --configuration Release

      # The agent ships as one native executable: publish it as the release does and run its
      # self-check (texts, embedded documentation, an HTTP round trip), which needs no display.
      - name: Publish the native agent (AOT) and check it
        shell: bash
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-ARM64) rid=linux-arm64 ;;
            Linux-*) rid=linux-x64 ;;
            Windows-*) rid=win-x64 ;;
            macOS-ARM64) rid=osx-arm64 ;;
            *) rid=osx-x64 ;;
          esac
          dotnet publish src/Apps/SimpleSign.Agent/SimpleSign.Agent.csproj -c Release -r "$rid" -o publish-agent
          ./publish-agent/SimpleSign.Agent --self-check

