# The EU DSS validation service for the TestBench's cross-validation.
#   docker compose -f tools/dss/docker-compose.yml up --build
# Then turn "DSS" on in the TestBench's top bar (address: http://localhost:8080).
services:
  dss:
    build:
      context: .
      args:
        DSS_VERSION: "6.3"
    image: simplesign-dss-webapp:6.3
    # Rebuild on every "up" (seconds, from the build cache), so a changed entrypoint is never stale.
    pull_policy: build
    ports:
      - "127.0.0.1:${DSS_PORT:-8080}:8080"
    environment:
      # Where the SimpleSign Sandbox is, to trust its root at start (Docker Desktop reaches the host this way).
      SANDBOX_URL: ${SANDBOX_URL:-http://host.docker.internal:5300}
      # "list" (default): trust the Sandbox through its list of trusted lists (/tl/lotl.xml), as DSS trusts the EU's.
      # "anchor": trust its root alone, as a bare trust anchor.
      DSS_SANDBOX_TRUST: ${DSS_SANDBOX_TRUST:-list}
      # How often the trusted lists are downloaded again (seconds). Empty: 10 with the Sandbox's list alone, 3600 with the EU lists.
      DSS_TL_REFRESH_SECONDS: ${DSS_TL_REFRESH_SECONDS:-}
      # The ports the Sandbox's certificates name on localhost (HTTP, HTTPS, LDAP), forwarded from
      # the container's localhost to SANDBOX_FORWARD_HOST, so a default Sandbox works as is. "" turns it off.
      SANDBOX_FORWARD_PORTS: ${SANDBOX_FORWARD_PORTS-5300 5301 5302}
      SANDBOX_FORWARD_HOST: ${SANDBOX_FORWARD_HOST:-host.docker.internal}
      # "false" (default): DSS fetches revocation data for every request, like SimpleSign. "true": the DSS
      # demo's cache (CRLs up to 3 h), which answers from old data when the Sandbox's servers are down.
      DSS_REVOCATION_CACHE: ${DSS_REVOCATION_CACHE:-false}
      # Optional: a TestBench, whose connected Sandbox's root is used when SANDBOX_URL does not answer.
      TESTBENCH_URL: ${TESTBENCH_URL:-}
      # The EU trusted lists, to validate real EU signatures: "false" (none), "true" (download at
      # start and every hour; needs the internet) or "cached" (only what an earlier "true" run kept).
      DSS_LOAD_EU_TRUSTED_LISTS: ${DSS_LOAD_EU_TRUSTED_LISTS:-false}
      # "true" trusts the ICP-Brasil roots that SimpleSign.Brazil.IcpBrasil embeds (v4, v7 and v13 cannot be loaded; see the README).
      DSS_TRUST_ICP_BRASIL: ${DSS_TRUST_ICP_BRASIL:-true}
      # "true" trusts the Gov.br root that SimpleSign.Brazil.GovBr embeds.
      DSS_TRUST_GOVBR: ${DSS_TRUST_GOVBR:-true}
      # "true" trusts the CAs of the Peruvian trusted list (INDECOPI), downloaded at start.
      DSS_TRUST_PERU: ${DSS_TRUST_PERU:-true}
      DSS_PERU_TSL_URL: ${DSS_PERU_TSL_URL:-https://iofe.indecopi.gob.pe/TSL/tsl-pe.xml}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Certificates (PEM or DER) in this folder are trusted too.
      - ./trust:/trust:ro
      # The library's own copies of the ICP-Brasil and Gov.br roots, so DSS and SimpleSign trust the same ones.
      - ../../src/TrustFrameworks/Brazil/IcpBrasil/SimpleSign.Brazil.IcpBrasil/Certs:/trust-icp-brasil:ro
      - ../../src/TrustFrameworks/Brazil/GovBr/SimpleSign.Brazil.GovBr/Certs:/trust-govbr:ro
      # What is downloaded (EU trusted lists, Peruvian trusted list), kept between runs.
      - tl-cache:/var/cache/dss

volumes:
  tl-cache:
