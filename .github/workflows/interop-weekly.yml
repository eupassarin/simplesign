name: Interop (weekly)

# Cross-validation with the EU DSS: the TestBench signs against a SimpleSign Sandbox, sends every
# signature to DSS 6.3 (the image dss-image.yml publishes) and compares the verdicts
# (DssCrossValidationTests, DssScenarioCrossValidationTests). Too slow for every push, so once a week.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: interop-weekly
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The TestBench UI (src/Apps/Development/SimpleSign.TestBench/web) is not needed by these tests.
  SkipWeb: true
  DSS_VERSION: '6.3'

jobs:
  dss:
    name: DSS cross-validation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image built from this exact tools/dss; the latest 6.3 when that one was not published.
      - name: Pull the DSS image
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/simplesign-dss"
          exact="$image:$DSS_VERSION-$(git rev-parse --short HEAD:tools/dss)"
          if docker pull "$exact"; then
            echo "ref=$exact" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$exact is not published (run the DSS image workflow); using $image:$DSS_VERSION"
            docker pull "$image:$DSS_VERSION"
            echo "ref=$image:$DSS_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: dotnet build tests/unit/Apps/Development/SimpleSign.TestBench.Tests --configuration Release && dotnet build src/Apps/Development/SimpleSign.Sandbox --configuration Release

      # As the testbench job of ci.yml does.
      - name: Start the SimpleSign Sandbox
        shell: bash
        run: |
          dotnet run --project src/Apps/Development/SimpleSign.Sandbox --no-build --configuration Release -- --ephemeral --no-browser > sandbox.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5300/api/info > /dev/null 2>&1; then
              echo "Sandbox is up"; exit 0
            fi
            sleep 2
          done
          echo "The Sandbox did not answer on http://localhost:5300"; cat sandbox.log; exit 1

      # After the Sandbox: the container fetches its root and trusted list when it starts. The Sandbox
      # binds loopback only, so DSS shares the host's network; its certificates' localhost:5300-5302
      # are then the Sandbox itself, and nothing is forwarded (SANDBOX_FORWARD_PORTS="").
      - name: Start DSS
        shell: bash
        run: |
          docker run -d --name dss --network host \
            -e SANDBOX_URL=http://localhost:5300 \
            -e SANDBOX_FORWARD_PORTS="" \
            -e DSS_TRUST_PERU=false \
            -v "$PWD/tools/dss/trust:/trust:ro" \
            -v "$PWD/src/Extensions/Brazil/IcpBrasil/SimpleSign.Brazil.IcpBrasil/Certs:/trust-icp-brasil:ro" \
            -v "$PWD/src/Extensions/Brazil/GovBr/SimpleSign.Brazil.GovBr/Certs:/trust-govbr:ro" \
            -v "$PWD/src/Apps/Development/SimpleSign.TestBench/TsaRoots:/trust-tsa:ro" \
            "${{ steps.image.outputs.ref }}"
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:8080/services/ 2>/dev/null | grep -q CXF; then
              echo "DSS is up after about $((i * 5)) s"; exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' dss)" != "true" ]; then
              echo "The DSS container stopped"; docker logs dss; exit 1
            fi
            sleep 5
          done
          echo "DSS did not answer on http://localhost:8080/services/ within 10 minutes"; docker logs dss; exit 1

      - name: Cross-validate with DSS
        env:
          SIMPLESIGN_SANDBOX_URL: http://localhost:5300/
          SIMPLESIGN_REQUIRE_SANDBOX: "true"
          SIMPLESIGN_REQUIRE_DSS: "true"
        run: >
          dotnet test tests/unit/Apps/Development/SimpleSign.TestBench.Tests --configuration Release --no-build
          --filter "FullyQualifiedName~Dss"
          --results-directory TestResults
          --logger "trx;LogFileName=dss-cross-validation.trx"
          --logger "console;verbosity=normal"

      - name: Collect logs
        if: always()
        shell: bash
        run: |
          mkdir -p TestResults
          docker logs dss > TestResults/dss.log 2>&1 || echo "no DSS container" > TestResults/dss.log
          cp sandbox.log TestResults/ 2>/dev/null || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dss-cross-validation
          path: TestResults/
          retention-days: 30
