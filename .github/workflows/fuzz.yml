name: Fuzz

on:
  schedule:
    - cron: '0 5 * * 3'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [pdf, dss, timestamp, ocsp, cms, validator, xref, html, css, xades-validate, cades-sign]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Publish fuzz harness
        run: dotnet publish tests/fuzz/SimpleSign.Fuzz -c Release -f net10.0 -o ./fuzz-publish

      # Built-in mutation fuzzer: needs no AFL/libFuzzer install. Exit code 3 = finding.
      - name: Run fuzz target
        timeout-minutes: 15
        run: |
          dotnet ./fuzz-publish/SimpleSign.Fuzz.dll ${{ matrix.target }} \
            --mutate 600 --seed ${{ github.run_number }} --hang-seconds 30 --out ./fuzz-publish/Crashes

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: ./fuzz-publish/Crashes/
